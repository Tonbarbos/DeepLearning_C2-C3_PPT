# Publica o jogo no GitHub Pages a cada push na main.
#
# O site é estático (sem build), então a publicação só precisa empacotar a pasta
# e enviá-la. Antes disso, os 24 testes de `js/testes.js` rodam: se a lógica do
# jogo quebrar, o deploy não acontece.
#
# `configure-pages` com `enablement: true` liga o Pages pela API caso ainda não
# esteja ligado, dispensando a configuração manual em Settings → Pages.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar à mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já estiver em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  testes:
    name: Testes da lógica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Rodar os testes
        run: node js/testes.js

  publicar:
    name: Publicar
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configurar o Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
